<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b2b">
<title>WIND LAB V9.2.3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px system-ui,Arial;background:#163322;color:#fff}
#app{position:relative;height:100dvh;min-height:450px;overflow:hidden}
#map,#terrain{position:absolute;inset:0}
#terrain{display:none;z-index:2;touch-action:none}
#windCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#map{z-index:1}
.ui{position:absolute;inset:0;z-index:5;pointer-events:none}
button,select,input,.panel,.compass{pointer-events:auto}
button,select{background:#315a46;border:1px solid #b9d9c4;color:white;border-radius:7px;padding:7px;font:inherit}
button:active{background:#507d61}
.status{position:absolute;top:7px;left:7px;max-width:55%;background:#102b20e8;border-radius:7px;padding:7px;line-height:1.4}
.actions{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.actions button{font-size:10px;max-width:110px;min-height:29px;padding:4px 6px}
.actions.collapsed button:not(#menu){display:none}
#menu{background:#173b2bee;font-weight:700}
.panel{position:absolute;bottom:8px;left:8px;right:8px;max-height:48%;overflow:auto;background:#102b20f3;border:1px solid #b9d9c4;border-radius:12px;padding:10px}
.tabs{display:flex;gap:3px}
.tabs button{flex:1;padding:7px 2px}
.tabs .active{background:#cde7d4;color:#163322}
.section{display:none}
.section.active{display:block}
.line{display:flex;align-items:center;gap:9px;margin:11px 0}
.line label{flex:1;min-width:0}
input[type=range],select{width:100%}
.summary{background:#25513c;border-radius:7px;padding:8px;line-height:1.5}
.bottom{position:absolute;bottom:8px;right:8px}
.open{position:absolute;bottom:8px;left:8px;display:none}
.compass{position:absolute;left:8px;top:72px;width:40px;padding:2px;background:#102b20ee;border:1px solid #bad8c3;border-radius:12px;text-align:center;touch-action:none;box-shadow:0 2px 12px #0008}
.handle{font-size:6px;padding:3px 0;min-height:20px;border-bottom:1px solid #ffffff44;touch-action:none}
.dial{width:19px;height:19px;margin:auto;touch-action:none;display:block}
.readout{font-weight:bold;font-size:7px}
.small{font-size:5px;opacity:.8}
#gpsPin{position:absolute;z-index:4;pointer-events:none;display:none;transform:translate(-50%,-50%);width:24px;height:24px;border:3px solid white;border-radius:50%;background:#159dff;box-shadow:0 0 0 7px #159dff44,0 2px 8px #000a}
#gpsPin::after{content:'YOU';position:absolute;top:29px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;background:#102b20ed;color:white;padding:2px 5px;border-radius:4px}
.bottom{font-size:10px;padding:5px 7px}
.hidden{display:none!important}
.pinPanel{position:absolute;bottom:56px;left:8px;right:8px;max-height:42%;overflow:auto;background:#102b20f5;border:1px solid #b9d9c4;border-radius:10px;padding:10px;pointer-events:auto}
.pinPanel input,.pinPanel select{width:100%;padding:8px;background:#244c39;color:white;border:1px solid #98b6a1;border-radius:6px}
.pinPanel .line{margin:7px 0}
.pinPanel button{padding:7px}
.pinLabel{background:#11291bdc;color:#fff;border-radius:4px;padding:2px 4px;white-space:nowrap;font-size:10px}
.leaflet-div-icon{background:none;border:none}
.leaflet-control-attribution{font-size:9px!important}
</style>
</head>
<body>
<div id="app">
<div id="map"></div>
<div id="terrain"></div>
<canvas id="windCanvas"></canvas>
<div id="gpsPin" role="img" aria-label="Your GPS location"></div>
<div class="ui">
<div id="status" class="status">Starting WIND LAB…</div>
<div class="actions collapsed" id="actions">
<button id="menu">☰ Tools</button>
<button id="gps">🔵 GPS / My Location</button>
<button id="follow">▶ Follow Me</button>
<button id="goStand">📍 Go to Stand</button>
<button id="place">Place Stand</button>
<button id="record">📌 Record Wind</button>
<button id="addPin">＋ Add Pin</button>
<button id="pins">📍 Manage Pins</button>
<button id="coneMode">🌬 All Cones</button>
<button id="home">Go to Property</button>
<button id="north">North Up</button>
</div>
<div class="compass" id="compass">
<div class="handle" id="handle">☰ DRAG COMPASS</div>
<svg class="dial" id="dial" viewBox="0 0 120 120">
<circle cx="60" cy="60" r="55" fill="#183b2b" stroke="#c9e8d0" stroke-width="2"/>
<circle cx="60" cy="60" r="43" fill="none" stroke="#ffffff55"/>
<g fill="white" font-size="13" text-anchor="middle">
<text x="60" y="17">N</text>
<text x="104" y="64">E</text>
<text x="60" y="111">S</text>
<text x="16" y="64">W</text>
</g>
<g id="needle">
<polygon points="60,21 54,60 66,60" fill="#ff5555"/>
<polygon points="60,99 54,60 66,60" fill="#d9e5e0"/>
</g>
<circle cx="60" cy="60" r="7" fill="#ffe132" stroke="white" stroke-width="2"/>
</svg>
<div class="readout" id="readout">315° NW</div>
<div class="small">WIND FROM · TURN DIAL</div>
</div>
<button class="open" id="open">☰ Controls</button>
<div class="panel" id="panel">
<div class="tabs">
<button data-tab="weather" class="active">Weather</button>
<button data-tab="wind">Wind</button>
<button data-tab="sim">Simulator</button>
<button data-tab="terrain">3D</button>
<button id="close">✕</button>
</div>
<div class="section active" id="weather">
<div class="summary" id="forecast">Loading forecast…</div>
<div class="line"><button id="refresh">↻ Forecast</button><button id="current">Use Current</button></div>
<div class="line"><label>Forecast hour<select id="hours"></select></label><button id="apply">Apply</button></div>
<div class="line"><label>Wind source<select id="source"><option value="manual">Manual</option><option value="forecast">Forecast</option></select></label></div>
<div class="line"><label>Observed wind FROM <span id="obsDirText">315°</span><input id="obsDir" type="range" min="0" max="355" step="5" value="315"></label></div>
<div class="line"><label>Observed speed <span id="obsSpeedText">3 mph</span><input id="obsSpeed" type="range" min="0" max="30" value="3"></label></div>
<div class="line"><button id="saveObs">Save Observation</button><button id="clearObs">Clear</button></div>
<div id="obsList">Choose Record Wind, then tap terrain.</div>
</div>
<div class="section" id="wind">
<div class="line"><button id="minus">−5°</button><label>Wind FROM <b id="directionText">315° NW</b><input id="direction" type="range" min="0" max="355" step="5" value="315"></label><button id="plus">+5°</button></div>
<div class="line"><label>Speed <b id="speedText">8 mph</b><input id="speed" type="range" min="0" max="30" value="8"></label></div>
<div class="line"><label>Gusts <b id="gustText">12 mph</b><input id="gust" type="range" min="0" max="50" value="12"></label></div>
<div class="line"><label>Scent cone width<select id="spread"><option value="9">Narrow</option><option value="17" selected>Medium</option><option value="29">Wide</option></select></label></div>
<div class="line"><label>Wind particle density <b id="densityText">250</b><input id="density" type="range" min="50" max="600" step="25" value="250"></label></div>
<div class="line"><label>Animation speed <b id="motionText">3×</b><input id="motion" type="range" min=".5" max="8" step=".5" value="3"></label></div>
</div>
<div class="section" id="sim">
<div class="line"><label>Airflow model<select id="simulation"><option value="on">Terrain influenced (experimental)</option><option value="off">Straight-line</option></select></label></div>
<div class="line"><label>Leeward eddies<select id="eddies"><option value="on">Experimental on</option><option value="off">Off</option></select></label></div>
<div class="line"><label>Eddy strength <b id="eddyStrengthText">65%</b><input id="eddyStrength" type="range" min="0" max="100" value="65"></label></div>
<div class="line"><label>Wind height<select id="windHeight"><option value="1.5">5 ft</option><option value="6" selected>20 ft</option><option value="12">40 ft</option><option value="24">80 ft</option></select></label></div>
<div class="line"><label>Terrain influence <b id="influenceText">65%</b><input id="influence" type="range" min="0" max="100" value="65"></label></div>
<div class="line"><label>Turbulence <b id="turbulenceText">35%</b><input id="turbulence" type="range" min="0" max="100" value="35"></label></div>
<div class="line"><label>Particle colors<select id="color"><option value="diagnostic">Green / Yellow / Red</option><option value="white">White</option><option value="cyan">Cyan</option></select></label></div>
<div id="eddyInfo">Experimental model; not measured wind.</div>
<button id="animate">Animation: On</button>
</div>
<div class="section" id="terrainControls">
<div class="line"><button id="enable">Enable 3D</button><button id="back">2D Satellite</button></div>
<div class="line"><label>Tilt <b id="tiltText">45°</b><input id="tilt" type="range" min="0" max="65" value="45"></label></div>
<div class="line"><label>Terrain exaggeration <b id="heightText">3×</b><input id="height" type="range" min="1" max="6" step=".5" value="3"></label></div>
<div class="line"><label>Hillshade <b id="shadeText">45%</b><input id="shade" type="range" min="0" max="100" value="45"></label></div>
<div class="line"><button id="left">↶ Rotate</button><button id="right">Rotate ↷</button><button id="north2">North Up</button></div>
<div class="line"><button id="relief">Relief</button><button id="satellite">Satellite</button></div>
<div class="line"><button id="zoomIn">＋ Zoom</button><button id="zoomOut">－ Zoom</button></div>
<div id="terrainInfo">2D satellite active.</div>
</div>
</div>
<div id="pinPanel" class="pinPanel hidden">
<b id="pinHeading">Pin</b>
<div class="line"><label style="flex:1">Label (optional)<input id="pinName" placeholder="Automatic name"></label></div>
<div class="line">
<label style="flex:1">Type<select id="pinType"><option value="stand">Stand + scent cone</option><option value="scout">Scouting marker</option><option value="bedding">Bedding</option><option value="sign">Deer sign</option><option value="access">Access</option><option value="funnel">Funnel</option></select></label>
<label>Color<input id="pinColor" type="color" value="#ffdc20" style="width:54px;height:37px"></label>
</div>
<div class="line"><button id="pinSave">Save Pin</button><button id="pinFocus">Focus</button><button id="pinDelete">Delete</button><button id="pinCancel">Close</button></div>
<div class="line"><button id="pinExport">Export Backup</button><button id="pinImport">Import Backup</button><input type="file" id="pinFile" accept="application/json,.json" class="hidden"></div>
<div id="pinList"></div>
</div>
<button class="bottom" id="clean">👁 Clean View</button>
<button class="bottom hidden" id="restore">👁 Show Controls</button>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">

const $=id=>document.getElementById(id), HOME=[32.60675,-86.61625],NORTH=[32.610286,-86.615062],SOUTH=[32.603200,-86.617447];
const SAT='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/',DEM='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),norm=x=>(x%360+360)%360,card=x=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(norm(x)/22.5)%16],v=id=>+$ (id).value;
let bearing=315,stand=[...HOME],location=[...HOME],gps=null,mode='2d',placement='',obsTarget=null,observations=[],weather=null,selected=null,following=false,watch=null,animation=true;
let map,fan,standMarker,gpsMarker,obsMarkers=[],three=null,loadId=0,terrainLoading=false;
const PINKEY='windlab_v922_pins';let pinsData=[],pinLayers=[],activePin=null,editingPin=null,pendingPin=null,conesMode='all';
try{let old=JSON.parse(localStorage.getItem(PINKEY)||'null');pinsData=Array.isArray(old)?old:[]}catch(_){}
if(!pinsData.length)pinsData=[{id:'original',lat:stand[0],lon:stand[1],name:'Stand 1',type:'stand',color:'#ffdc20'}];
activePin=pinsData.find(x=>x.type==='stand')?.id||null;
function savePins(){try{localStorage.setItem(PINKEY,JSON.stringify(pinsData))}catch(e){status('Pin storage unavailable; export a backup')}}
function selectedStand(){return pinsData.find(x=>x.id===activePin&&x.type==='stand')||pinsData.find(x=>x.type==='stand')}
function standLocations(){return pinsData.filter(x=>x.type==='stand'&&(conesMode==='all'||x.id===activePin))}
function fanFor(p){let len=v('speed')?150+v('speed')*48:0,half=Math.min(55,v('spread')+Math.max(0,v('gust')-v('speed'))*.45),d=norm(bearing+180),q=[[p.lat,p.lon]];for(let i=-32;i<=32;i++)q.push(dest([p.lat,p.lon],d+i/32*half,len));return q}
function updatePins(){if(!map)return;pinLayers.forEach(x=>x.remove());pinLayers=[];if(fan){fan.remove();fan=null}for(const p of standLocations())pinLayers.push(L.polygon(fanFor(p),{color:p.color,weight:2,fillOpacity:v('speed')?.24:0,opacity:v('speed')?1:0,interactive:false}).addTo(map));for(const p of pinsData){let icon=L.divIcon({className:'',html:`<div style="width:16px;height:16px;border:2px solid white;border-radius:50%;background:${p.color};box-shadow:0 0 5px #000"></div>${p.name?`<span class="pinLabel">${escapeHTML(p.name)}</span>`:''}`,iconSize:[20,20],iconAnchor:[8,8]});let m=L.marker([p.lat,p.lon],{icon,draggable:false}).addTo(map);m.on('click',()=>editPin(p.id));pinLayers.push(m)}if(three)update3DMarkers()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editPin(id){editingPin=id;pendingPin=null;let p=pinsData.find(x=>x.id===id);if(!p)return;$('pinHeading').textContent='Edit pin';$('pinName').value=p.name||'';$('pinType').value=p.type;$('pinColor').value=p.color;$('pinDelete').disabled=false;showPinPanel()}
function showPinPanel(){$('pinPanel').classList.remove('hidden');renderPinList()}
function renderPinList(){$('pinList').replaceChildren();pinsData.forEach(p=>{let b=document.createElement('button');b.textContent=(p.type==='stand'?'🌬 ':'📍 ')+(p.name||'Pin');b.style.margin='3px';b.onclick=()=>editPin(p.id);$('pinList').appendChild(b)})}
function newPin(p){pendingPin=p;editingPin=null;$('pinHeading').textContent='New pin';$('pinName').value='';$('pinType').value='stand';$('pinColor').value='#ffdc20';$('pinDelete').disabled=true;showPinPanel()}
function selectActive(id){activePin=id;let p=selectedStand();if(p)stand=[p.lat,p.lon];sync();updatePins()}

function status(s){$('status').textContent=s;clearTimeout(status.timer);status.timer=setTimeout(()=>$('status').style.opacity='.3',7000);$('status').style.opacity='1'}
function dest(p,d,m){let a=d*Math.PI/180;return [p[0]+Math.cos(a)*m/111320,p[1]+Math.sin(a)*m/(111320*Math.cos(p[0]*Math.PI/180))]}
function fanPoints(){let len=v('speed')?150+v('speed')*48:0,half=Math.min(55,v('spread')+Math.max(0,v('gust')-v('speed'))*.45),d=norm(bearing+180),p=[stand];for(let i=-32;i<=32;i++)p.push(dest(stand,d+i/32*half,len));return p}
function pin(color,size=23){return L.divIcon({className:'',html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 0 8px black"></div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})}
function initMap(){if(!window.L){status('Leaflet failed to load. Check connection.');return}
 map=L.map('map',{zoomControl:false}).setView(HOME,15);
 L.tileLayer(SAT+'{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}).addTo(map);
 // Saved stands own their scent cones.

 [NORTH,SOUTH].forEach((p,i)=>L.circleMarker(p,{radius:7,color:'white',weight:2,fillColor:i?'#fb923c':'#ef4444',fillOpacity:1}).addTo(map));
 standMarker=null;
 updatePins();
 map.on('click',e=>{if(!placement)return;let p=[e.latlng.lat,e.latlng.lng],a=placement;placement='';if(a==='stand')setStand(p);else if(a==='pin')newPin(p);else chooseObs(p)});
 sync();status('WIND LAB · 2D satellite ready')
}
function sync(){ $('direction').value=bearing;$('readout').textContent=$('directionText').textContent=bearing+'° '+card(bearing);$('needle').setAttribute('transform',`rotate(${bearing} 60 60)`);for(let n of ['speed','gust','density','motion'])$(n+'Text').textContent=v(n)+(n==='speed'||n==='gust'?' mph':n==='motion'?'×':'');
 updatePins()}
function setBearing(n,manual=true){bearing=norm(Math.round(n/5)*5);if(manual)$('source').value='manual';sync()}
function setStand(p){newPin(p);$('pinType').value='stand';status('Choose Save Pin to add this stand')}
function gps2D(){if(!gps||!map)return;if(gpsMarker)gpsMarker.remove();gpsMarker=L.marker(gps,{icon:pin('#159dff',25),zIndexOffset:1000}).addTo(map).bindPopup('Your GPS location')}
function gps3D(){let pin=$('gpsPin');if(mode!=='3d'||!three||!gps){pin.style.display='none';return}let p=geoToWorld(gps);if(!p.inside){pin.style.display='none';return}let g=three,vec=new g.T.Vector3(p.x,ground(p.x,p.z)+3,p.z).project(g.camera);if(vec.z< -1||vec.z>1||Math.abs(vec.x)>1||Math.abs(vec.y)>1){pin.style.display='none';return}pin.style.display='block';pin.style.left=(vec.x+1)*50+'%';pin.style.top=(1-vec.y)*50+'%'}
function drawObs(){obsMarkers.forEach(m=>m.remove());obsMarkers=observations.map(o=>L.marker([o.lat,o.lon],{icon:L.divIcon({className:'',html:'📌',iconSize:[26,26]})}).addTo(map).bindPopup(`${o.dir}° · ${o.speed} mph`));$('obsList').textContent=observations.length?observations.map((o,i)=>`${i+1}. ${o.dir}° ${card(o.dir)} · ${o.speed} mph`).join(' | '):'No observations.'}
function chooseObs(p){obsTarget=p;showTab('weather');status('Wind observation location selected')}
function tile(lat,lon,z){let n=2**z,r=lat*Math.PI/180;return{x:(lon+180)/360*n,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n}}
function config(p){let z=13,t=tile(...p,z);return{z,x:Math.floor(t.x)-1,y:Math.floor(t.y)-1,nx:3,ny:3,satZ:14}}
async function bitmap(url){let r=await fetch(url);if(!r.ok)throw Error('Tile HTTP '+r.status);return createImageBitmap(await r.blob())}
async function elevation(c){let w=c.nx*256,h=c.ny*256,cv=document.createElement('canvas');cv.width=w;cv.height=h;let cx=cv.getContext('2d',{willReadFrequently:true});await Promise.all(Array.from({length:c.nx*c.ny},async(_,i)=>{let x=i%c.nx,y=Math.floor(i/c.nx),b=await bitmap(`${DEM}${c.z}/${c.x+x}/${c.y+y}.png`);cx.drawImage(b,x*256,y*256);b.close()}));let px=cx.getImageData(0,0,w,h).data,arr=new Float32Array(w*h),low=Infinity,high=-Infinity;for(let i=0;i<arr.length;i++){let k=i*4,n=px[k]*256+px[k+1]+px[k+2]/256-32768;arr[i]=n;low=Math.min(low,n);high=Math.max(high,n)}return{arr,w,h,low,high}}
async function imagery(c){let scale=2**(c.satZ-c.z),cols=c.nx*scale,rows=c.ny*scale,cv=document.createElement('canvas');cv.width=cols*256;cv.height=rows*256;let cx=cv.getContext('2d'),q=Array.from({length:cols*rows},(_,i)=>[i%cols,Math.floor(i/cols)]),done=0;await Promise.all(Array.from({length:8},async()=>{while(q.length){let [x,y]=q.shift();try{let b=await bitmap(`${SAT}${c.satZ}/${c.y*scale+y}/${c.x*scale+x}`);cx.drawImage(b,x*256,y*256);b.close();done++}catch(_){}}}));return done?cv:null}
function sample(x,y){let g=three;x=clamp(x,0,g.w-1);y=clamp(y,0,g.h-1);let x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(g.w-1,x0+1),y1=Math.min(g.h-1,y0+1),a=x-x0,b=y-y0;return g.arr[y0*g.w+x0]*(1-a)*(1-b)+g.arr[y0*g.w+x1]*a*(1-b)+g.arr[y1*g.w+x0]*(1-a)*b+g.arr[y1*g.w+x1]*a*b}
function ground(x,z){let g=three;return (sample((x/g.W+.5)*(g.w-1),(z/g.D+.5)*(g.h-1))-(g.low+g.high)/2)*v('height')}
function geoToWorld(p){let g=three,t=tile(...p,g.c.z),fx=(t.x-g.c.x)/g.c.nx,fy=(t.y-g.c.y)/g.c.ny;return{x:(fx-.5)*g.W,z:(fy-.5)*g.D,inside:fx>=0&&fx<=1&&fy>=0&&fy<=1}}
